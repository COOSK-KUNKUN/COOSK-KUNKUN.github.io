<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件照制作 - 重新设计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .settings-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        /* 尺寸规格 */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .size-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .size-card {
            border: 2px solid #e8ecf0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        .size-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .size-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .size-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #f5f0ff 100%);
        }

        .size-card.active::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }

        .size-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .size-dim {
            font-size: 12px;
            color: #9ca3af;
            position: relative;
            z-index: 1;
        }

        /* 背景颜色 */
        .color-section {
            margin-bottom: 24px;
        }

        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 16px;
        }

        .color-option {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid #e8ecf0;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .color-option:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .color-option.active {
            border-color: #667eea;
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .color-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .color-white { background: #ffffff; }
        .color-white.active::after { color: #667eea; text-shadow: none; }
        .color-red { background: #e53935; }
        .color-blue-dark { background: #3b6fa0; }
        .color-blue-light { background: #7bb8e8; }
        .color-blue { background: #4a90d9; }
        .color-gray { background: #f5f5f5; }

        .color-hint {
            font-size: 13px;
            color: #9ca3af;
            padding-left: 4px;
        }

        /* 复选框 */
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            margin-bottom: 20px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            cursor: pointer;
        }

        /* 高级设置 */
        .advanced-section {
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
            margin-bottom: 24px;
        }

        .collapse-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 0;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            user-select: none;
            transition: color 0.2s;
        }

        .collapse-header:hover {
            color: #667eea;
        }

        .collapse-header .arrow {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .collapse-header.open .arrow {
            transform: rotate(90deg);
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .collapse-content.open {
            max-height: 200px;
            opacity: 1;
        }

        .select-wrapper {
            position: relative;
            margin-top: 12px;
        }

        .select-wrapper select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            background: #fff;
            appearance: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-wrapper select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
            font-size: 14px;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            border: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #555;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #eee;
            border-color: #ccc;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* 响应式 */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .settings-card {
                padding: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="settings-card">
            <!-- 尺寸规格 -->
            <div class="section-title">尺寸规格</div>
            <div class="size-grid">
                <div class="size-card">
                    <div class="size-name">一寸</div>
                    <div class="size-dim">25×35mm</div>
                </div>
                <div class="size-card">
                    <div class="size-name">身份证</div>
                    <div class="size-dim">26×32mm</div>
                </div>
                <div class="size-card">
                    <div class="size-name">二寸</div>
                    <div class="size-dim">35×49mm</div>
                </div>
                <div class="size-card active">
                    <div class="size-name">护照</div>
                    <div class="size-dim">35×45mm</div>
                </div>
            </div>

            <!-- 背景颜色 -->
            <div class="color-section">
                <div class="section-title">背景颜色</div>
                <div class="color-grid">
                    <div class="color-option color-white active"></div>
                    <div class="color-option color-red"></div>
                    <div class="color-option color-blue"></div>
                    <div class="color-option color-blue-light"></div>
                    <div class="color-option color-blue-dark"></div>
                    <div class="color-option color-gray"></div>
                </div>
                <p class="color-hint">适用：社保 / 签证 / 通用</p>
            </div>

            <!-- 构图参考线 -->
            <div class="checkbox-row">
                <input type="checkbox" id="showGuides">
                <label class="checkbox-label" for="showGuides">显示构图参考线</label>
            </div>

            <!-- 高级设置 -->
            <div class="advanced-section">
                <div class="collapse-header open" onclick="toggleCollapse(this)">
                    <span class="arrow">▶</span>
                    高级设置
                </div>
                <div class="collapse-content open">
                    <div class="select-wrapper">
                        <select>
                            <option>通用（默认）</option>
                            <option>高精度模式</option>
                            <option>快速模式</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-secondary">重新上传</button>
                <button class="btn btn-primary">生成证件照</button>
            </div>
        </div>
    </div>

    <script>
        // 尺寸卡片选择
        document.querySelectorAll('.size-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.size-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 颜色选择
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 折叠面板
        function toggleCollapse(header) {
            header.classList.toggle('open');
            const content = header.nextElementSibling;
            content.classList.toggle('open');
        }
    </script>
</body>
</html>

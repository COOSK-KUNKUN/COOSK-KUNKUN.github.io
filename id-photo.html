<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件照制作</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #F5F6FA;
            min-height: 100vh;
            color: #1a1a2e;
            padding: 24px;
        }

        /* 主内容区 */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* 左侧照片编辑区 */
        .photo-editor {
            flex: 1;
            min-width: 0;
        }

        .photo-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
        }

        .photo-preview-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            aspect-ratio: 3/4;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            border: 2px dashed #4A90D9;
            cursor: grab;
        }

        .photo-preview-wrapper:active {
            cursor: grabbing;
        }

        .photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 构图参考线 */
        .guide-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .guide-line-h {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            border-top: 1.5px dashed rgba(74, 144, 217, 0.6);
        }

        .guide-line-h.top {
            top: 14%;
        }

        .guide-line-h.bottom {
            bottom: 16%;
        }

        .guide-line-v {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            border-left: 1.5px dashed rgba(74, 144, 217, 0.6);
            left: 50%;
        }

        .guide-label {
            position: absolute;
            font-size: 13px;
            color: #4A90D9;
            font-weight: 500;
        }

        .guide-label.top-label {
            top: 10%;
            left: 10px;
        }

        .guide-label.bottom-label {
            bottom: 12%;
            left: 10px;
        }

        /* 头部椭圆参考 */
        .head-oval {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 52%;
            height: 58%;
            border: 1.5px dashed rgba(74, 144, 217, 0.5);
            border-radius: 50%;
        }

        /* 底部提示 */
        .photo-hints {
            text-align: center;
            margin-top: 20px;
        }

        .photo-hints .drag-hint {
            font-size: 14px;
            color: #9CA3AF;
            margin-bottom: 8px;
        }

        .photo-hints .warning-hint {
            font-size: 14px;
            color: #E8913A;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .photo-hints .warning-hint .warn-icon {
            font-size: 14px;
        }

        /* 右侧设置面板 */
        .settings-panel {
            width: 340px;
            flex-shrink: 0;
        }

        .settings-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 14px;
        }

        /* 尺寸卡片网格 */
        .size-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .size-card {
            border: 1.5px solid #E8ECF0;
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .size-card:hover {
            border-color: #4A90D9;
            box-shadow: 0 2px 8px rgba(74, 144, 217, 0.1);
        }

        .size-card.active {
            border-color: #4A90D9;
            background: #F0F6FF;
        }

        .size-card .size-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 3px;
        }

        .size-card .size-dim {
            font-size: 12px;
            color: #9CA3AF;
        }

        /* 背景颜色选择 */
        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .color-option {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2.5px solid #E8ECF0;
            position: relative;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .color-option:hover {
            transform: scale(1.08);
        }

        .color-option.active {
            border-color: #4A90D9;
            transform: scale(1.08);
        }

        .color-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4A90D9;
            font-size: 15px;
            font-weight: bold;
        }

        .color-option.white { background: #FFFFFF; }
        .color-option.white.active::after { color: #4A90D9; }
        .color-option.red { background: #E53935; }
        .color-option.red.active::after { color: #fff; }
        .color-option.blue-dark { background: #3B6FA0; }
        .color-option.blue-dark.active::after { color: #fff; }
        .color-option.blue-light { background: #7BB8E8; }
        .color-option.blue-light.active::after { color: #fff; }
        .color-option.blue { background: #4A90D9; }
        .color-option.blue.active::after { color: #fff; }

        /* 自定义颜色按钮 */
        .custom-color-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1.5px solid #E8ECF0;
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .custom-color-btn:hover {
            border-color: #4A90D9;
            color: #4A90D9;
        }

        .custom-color-btn .color-box {
            width: 14px;
            height: 14px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .color-hint {
            font-size: 13px;
            color: #9CA3AF;
        }

        /* 复选框行 */
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #4A90D9;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            cursor: pointer;
        }

        /* 折叠面板 */
        .collapse-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 10px 0;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            user-select: none;
        }

        .collapse-header .arrow {
            transition: transform 0.3s ease;
            font-size: 11px;
        }

        .collapse-header.open .arrow {
            transform: rotate(90deg);
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapse-content.open {
            max-height: 200px;
        }

        /* 下拉选择 */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #E8ECF0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            background: #fff;
            appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-wrapper select:focus {
            outline: none;
            border-color: #4A90D9;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: #F0F0F0;
            margin: 20px 0;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 13px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-secondary {
            background: #fff;
            color: #555;
            border: 1.5px solid #E0E0E0;
        }

        .btn-secondary:hover {
            border-color: #ccc;
            background: #FAFAFA;
        }

        .btn-primary {
            background: #2D7BE5;
            color: #fff;
            border: none;
            box-shadow: 0 3px 12px rgba(45, 123, 229, 0.25);
        }

        .btn-primary:hover {
            background: #2568C8;
            box-shadow: 0 4px 16px rgba(45, 123, 229, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }

            .settings-panel {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .photo-card, .settings-card {
                padding: 16px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧照片编辑区 -->
        <div class="photo-editor">
            <div class="photo-card">
                <div class="photo-preview-wrapper">
                    <!-- 模拟真实照片 -->
                    <img class="photo-preview" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500&h=667&fit=crop&crop=face" alt="证件照预览" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)';">

                    <!-- 构图参考线 -->
                    <div class="guide-lines">
                        <div class="guide-line-h top"></div>
                        <div class="guide-line-h bottom"></div>
                        <div class="guide-line-v"></div>
                        <div class="head-oval"></div>
                        <span class="guide-label top-label">头顶</span>
                        <span class="guide-label bottom-label">下巴</span>
                    </div>
                </div>

                <div class="photo-hints">
                    <p class="drag-hint">拖拽移动 · 滚轮缩放</p>
                    <p class="warning-hint">
                        <span class="warn-icon"></span>
                        头部偏小，建议放大
                    </p>
                </div>
            </div>
        </div>

        <!-- 右侧设置面板 -->
        <div class="settings-panel">
            <div class="settings-card">
                <!-- 尺寸规格 -->
                <div class="settings-section">
                    <div class="section-title">尺寸规格</div>
                    <div class="size-grid">
                        <div class="size-card">
                            <div class="size-name">一寸</div>
                            <div class="size-dim">25×35mm</div>
                        </div>
                        <div class="size-card">
                            <div class="size-name">身份证</div>
                            <div class="size-dim">26×32mm</div>
                        </div>
                        <div class="size-card active">
                            <div class="size-name">二寸</div>
                            <div class="size-dim">35×49mm</div>
                        </div>
                        <div class="size-card">
                            <div class="size-name">护照</div>
                            <div class="size-dim">35×45mm</div>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 背景颜色 -->
                <div class="settings-section">
                    <div class="section-title">背景颜色</div>
                    <div class="color-grid">
                        <div class="color-option white active"></div>
                        <div class="color-option red"></div>
                        <div class="color-option blue-dark"></div>
                        <div class="color-option blue-light"></div>
                        <div class="color-option blue"></div>
                    </div>
                    <button class="custom-color-btn">
                        <span class="color-box"></span>
                        自定义
                    </button>
                    <p class="color-hint">适用：社保 / 签证 / 通用</p>
                </div>

                <div class="divider"></div>

                <!-- 构图参考线复选框 -->
                <div class="settings-section">
                    <div class="checkbox-row">
                        <input type="checkbox" id="showGuides" checked>
                        <label class="checkbox-label" for="showGuides">显示构图参考线（头顶 / 下巴 / 居中）</label>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 高级设置 -->
                <div class="settings-section">
                    <div class="collapse-header open" onclick="toggleCollapse(this)">
                        <span class="arrow">▶</span>
                        高级设置
                    </div>
                    <div class="collapse-content open">
                        <div class="section-title" style="font-size: 14px; margin-top: 4px; margin-bottom: 10px;">AI 模型</div>
                        <div class="select-wrapper">
                            <select>
                                <option>通用（默认）</option>
                                <option>高精度模式</option>
                                <option>快速模式</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn btn-secondary">重新上传</button>
                    <button class="btn btn-primary">生成证件照</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 尺寸卡片选择
        document.querySelectorAll('.size-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.size-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 颜色选择
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 折叠面板
        function toggleCollapse(header) {
            header.classList.toggle('open');
            const content = header.nextElementSibling;
            content.classList.toggle('open');
        }

        // 参考线开关
        document.getElementById('showGuides').addEventListener('change', function() {
            const guides = document.querySelector('.guide-lines');
            guides.style.display = this.checked ? 'block' : 'none';
        });
    </script>
</body>
</html>

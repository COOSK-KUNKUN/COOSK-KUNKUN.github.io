            <div class="note-body changelog-body">
                <h2>新增功能</h2>
                <ul>
                    <li><strong>拼豆图纸</strong> — 上传图片，生成拼豆像素图纸与色号清单</li>
                    <li>像素化：横向格子数可调，支持主色 / 平均色两种取色模式</li>
                    <li>色号映射：291 色拼豆色板，Oklab 色彩空间就近匹配，支持多套色号系统</li>
                    <li>色号统计：按用量列出每种颜色的色块、色号与数量</li>
                    <li>导出：带色号标注的 PNG 图纸与颜色清单 CSV</li>
                </ul>

                <h2>优化</h2>
                <ul>
                    <li>证件照上传预览体验优化</li>
                    <li>AI 抠图共享模块重构，自托管模型资源</li>
                </ul>

                <h2>技术特性</h2>
                <ul>
                    <li>全程浏览器本地处理，图片不上传</li>
                </ul>
